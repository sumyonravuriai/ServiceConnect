<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – ServiceConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body style="background-color: var(--color-surface-alt); min-height: 100vh; display: flex; flex-direction: column;">

  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <div class="brand-text">Service<span>Connect</span></div>
      </a>
      <a href="login.html" class="btn btn-text btn-sm">Back to Sign In</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.75rem; box-shadow: var(--shadow-xl); border-radius: var(--radius-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="section-tag" style="margin-bottom: 0.5rem;">Account Recovery</span>
        <h1 style="font-size: var(--font-size-2xl); font-weight: 800; color: var(--color-primary); margin-top: 0.25rem;" id="fpTitle">Reset Your Password</h1>
        <p style="font-size: var(--font-size-sm); color: var(--color-text-muted);" id="fpSubtitle">Enter your registered email address to receive a secure recovery link.</p>
      </div>

      <div id="fpAlert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: var(--font-size-xs); font-weight: 600; margin-bottom: 1.5rem; line-height: 1.45;"></div>

      <!-- Phase 1: Request Reset Link Form -->
      <form id="requestResetForm">
        <div class="form-group">
          <label class="form-label" for="fpEmail">Registered Email Address</label>
          <input type="email" id="fpEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="requestSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Send Reset Link
        </button>
      </form>

      <!-- Phase 2: Enter New Password Form (If token is in URL) -->
      <form id="setNewPasswordForm" style="display: none;">
        <input type="hidden" id="resetToken">

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password (min 8 chars)</label>
          <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="8">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" class="form-control" placeholder="••••••••" required minlength="8">
        </div>

        <button type="submit" id="setNewSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Update Password
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; font-size: var(--font-size-sm); color: var(--color-text-muted);">
        Remember your password? <a href="login.html" style="color: var(--color-accent); font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertBox = document.getElementById('fpAlert');

    function showAlert(msg, isError = true) {
      alertBox.style.display = 'block';
      alertBox.style.backgroundColor = isError ? '#fee2e2' : '#dcfce7';
      alertBox.style.color = isError ? '#991b1b' : '#166534';
      alertBox.style.border = `1px solid ${isError ? '#fca5a5' : '#86efac'}`;
      alertBox.textContent = msg;
    }

    if (token) {
      // Show Phase 2 form
      document.getElementById('requestResetForm').style.display = 'none';
      document.getElementById('setNewPasswordForm').style.display = 'block';
      document.getElementById('resetToken').value = token;
      document.getElementById('fpTitle').textContent = 'Create New Password';
      document.getElementById('fpSubtitle').textContent = 'Please choose a strong password with at least 8 characters.';
    }

    // Handle Phase 1
    document.getElementById('requestResetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      const email = document.getElementById('fpEmail').value.trim();
      const btn = document.getElementById('requestSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await Api.request('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        showAlert(res.message || 'If an account matches that email, a reset link has been dispatched to your inbox.', false);
      } catch (err) {
        showAlert('If an account matches that email, a reset link has been dispatched to your inbox.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });

    // Handle Phase 2
    document.getElementById('setNewPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const resetToken = document.getElementById('resetToken').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      const btn = document.getElementById('setNewSubmitBtn');

      if (newPassword !== confirmNewPassword) {
        showAlert('Passwords do not match. Please re-enter.');
        return;
      }

      if (newPassword.length < 8) {
        showAlert('Password must be at least 8 characters long.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await Api.request('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token: resetToken, newPassword })
        });

        if (res && res.success) {
          showAlert('✓ Password has been reset successfully! Redirecting to sign in...', false);
          showToast('Password updated! Please sign in.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(res && res.message ? res.message : 'Invalid or expired reset token.', true);
        }
      } catch (err) {
        showAlert(err.message || 'Unable to update password. Please request a new reset link.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
