version: '3.8'

services:
  # MySQL 8.0 Database Container
  mysql:
    image: mysql:8.0
    container_name: serviceconnect_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: serviceconnect_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sc_network

  # Java 21 Spring Boot Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serviceconnect_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/serviceconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - sc_network

  # Lightweight Nginx Frontend Container
  frontend:
    image: nginx:alpine
    container_name: serviceconnect_frontend
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - sc_network

networks:
  sc_network:
    driver: bridge

volumes:
  mysql_data:
