# =============================================================================
# ServiceConnect Spring Boot Configuration
# =============================================================================

server.port=8080

# Spring DataSource (MySQL 8.0)
# Uses environment variables with sensible defaults for local development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/serviceconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000

# Server Compression & Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging
logging.level.com.serviceconnect=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# Spring Mail (SMTP Transactional Delivery)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloud Email Delivery over HTTPS Port 443 (Recommended for Render, AWS, PaaS)
# Set RESEND_API_KEY (from https://resend.com) or BREVO_API_KEY (from https://brevo.com) in Render Environment
resend.api-key=${RESEND_API_KEY:}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}

# Security, Tokens & Platform URLs
serviceconnect.jwt.secret=${JWT_SECRET:ServiceConnectSuperSecretKeyForJWTGenerationSha256HmacStandard2026}
serviceconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
serviceconnect.frontend.url=${FRONTEND_URL:https://serviceconnect-web.vercel.app}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.base-url=${APP_BASE_URL:https://serviceconnect-web.vercel.app}
