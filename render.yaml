services:
  # 1. Spring Boot Backend REST API
  - type: web
    name: serviceconnect-backend
    runtime: java
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "mvn clean package -DskipTests"
    startCommand: "java -Dserver.port=$PORT -jar target/serviceconnect-backend-1.0.0.jar"
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # 2. Static Frontend Web Application
  - type: static
    name: serviceconnect-frontend
    plan: free
    region: oregon
    rootDir: frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
